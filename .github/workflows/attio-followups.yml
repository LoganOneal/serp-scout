name: Attio follow-up tasks

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Create Attio tasks (otherwise dry-run)
        type: boolean
        default: false
  schedule:
    - cron: '10 15 * * *'

jobs:
  followups:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create follow-up tasks only
        env:
          ATTIO_API_KEY: ${{ secrets.ATTIO_API_KEY }}
          ATTIO_SEND_ENABLED: 'false'
          ATTIO_FOLLOWUP_FIRST_DAYS: ${{ vars.ATTIO_FOLLOWUP_FIRST_DAYS || '6' }}
          ATTIO_FOLLOWUP_SECOND_DAYS: ${{ vars.ATTIO_FOLLOWUP_SECOND_DAYS || '7' }}
        run: |
          MODE_FLAG="--dry-run"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.apply }}" = "true" ]; then
            MODE_FLAG="--apply"
          fi
          pnpm attio:followups $MODE_FLAG
