active_profile: pilot

profiles:
  pilot:
    discovery:
      serp_sample_size: 25
      organic_competitor_depth: 1
      serp_result_limit: 10
    research_sites:
      target_count: 8
    backlinks:
      follow_only: true
      provider_follow_filter: false
      min_authority_score: 20
      detailed_links_per_site: 50
      page_size: 10
    crawl:
      concurrency: 5
      timeout_seconds: 20
      max_attempts: 3
      deep_analysis_limit: 75
    analysis:
      provider: export
      model: configurable
    scoring:
      link_value_weight: 0.40
      gettability_weight: 0.30
      transferability_weight: 0.20
      effort_weight: 0.10

  scale:
    discovery:
      serp_sample_size: 400
      organic_competitor_depth: 1
